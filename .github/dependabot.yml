---
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    assignees:
      - arnested
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    assignees:
      - arnested
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    assignees:
      - arnested
